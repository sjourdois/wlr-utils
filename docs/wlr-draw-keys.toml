# Example wlr-draw keybindings — copy to ~/.config/wlr-draw/keys.toml and edit.
#
# Key names are XKB keysym names (the same ones sway/Hyprland use in `bindsym`):
# `a`, `space`, `plus`, `F5`, … matched case-insensitively. Each binding is
# a single name or a list of aliases. Anything you omit keeps its default, so you can
# delete every line you don't want to change. With no file at all, these are the defaults.

# --- Tools ---
pen = "p"
rect = "r"
mask = "m"
arrow = "a"
text = "t"
move = "s"
eraser = "e"

# --- Actions ---
palette = "c"
undo = "u"
redo = "y"
visibility = "v"
save = "w"
help = "h"
clear = "Delete"
width-inc = ["plus", "equal", "KP_Add"]
width-dec = ["minus", "KP_Subtract"]
freeze = ["space", "KP_Space"]
snap = "d"

# --- Held controls: a modifier (caps/ctrl/shift/alt/super), a regular key, or a list ---
# On a keyboard without a usable Caps Lock (e.g. HHKB), point `passthrough` elsewhere:
#   passthrough = "alt"      # or "super", or any key; "alt" leaves snap-invert unassigned
passthrough = "caps"
constrain = "ctrl"
spotlight = "shift"
snap-invert = "alt"

# --- Pen dwell-to-snap ---
# `dwell = false` starts with snapping off; `snap` and `snap-invert` still reach it.
dwell = true
dwell-ms = 650
