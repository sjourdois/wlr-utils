name: aur

# Publish the AUR packages (wlr-utils from source, wlr-utils-bin from the
# cargo-dist archive) on a release tag. Runs in an Arch container so
# makepkg/updpkgsums/makepkg --printsrcinfo are available. The push uses a
# dedicated AUR deploy key (secret AUR_SSH_KEY) whose public half is registered
# on the AUR account — the maintainer's personal signing key never enters CI.
#
# It keys off the `Release` workflow finishing, not off a `release: published`
# event — a release created by the GITHUB_TOKEN never emits that one. Without
# AUR_SSH_KEY set, it still builds and validates each package but skips the push.

on:
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.8.0)
        required: true

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v')) }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    env:
      # Whether a key is configured, as a plain flag the step conditions can read.
      # The secret itself is handed only to the step that writes it to disk: every
      # other step in this job runs code from the checked-out tag, and a deploy key
      # has no business being in their environment.
      HAS_AUR_KEY: ${{ secrets.AUR_SSH_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkgbuild: PKGBUILD
            name: wlr-utils
          - pkgbuild: PKGBUILD-bin
            name: wlr-utils-bin
    steps:
      - name: Resolve the release version
        id: ver
        env:
          # Through the environment, never interpolated into the script: this comes
          # from a `workflow_run` head_branch, and a branch name may hold shell
          # metacharacters. It then names a checkout ref and a package version, so it
          # is checked against what a release tag can look like and refused otherwise
          # — quoting our way around a value we can simply reject would be worse.
          RAW_TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          set -eu
          if ! printf '%s' "$RAW_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "refusing '$RAW_TAG': a release tag is vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          printf 'tag=%s\n'    "$RAW_TAG"     >>"$GITHUB_OUTPUT"
          printf 'pkgver=%s\n' "${RAW_TAG#v}" >>"$GITHUB_OUTPUT"

      - name: Install tooling
        run: pacman -Syu --noconfirm --needed git openssh pacman-contrib rust clang curl

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ver.outputs.tag }}

      - name: Prepare the PKGBUILD
        working-directory: packaging/aur
        env:
          PKGBUILD_FILE: ${{ matrix.pkgbuild }}
          PKGVER: ${{ steps.ver.outputs.pkgver }}
        run: |
          # The source package's file is already named PKGBUILD (copying it onto
          # itself is an error); only the -bin variant needs renaming into place.
          if [ "$PKGBUILD_FILE" != PKGBUILD ]; then
            cp "$PKGBUILD_FILE" PKGBUILD
          fi
          # The release drives the version; a fresh version resets pkgrel to 1.
          sed -i "s/^pkgver=.*/pkgver=$PKGVER/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Create a build user (makepkg refuses root)
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
          chown -R builder: .

      - name: Fill sums, build, generate .SRCINFO
        working-directory: packaging/aur
        run: |
          sudo -u builder bash -euo pipefail -c '
            updpkgsums
            makepkg --syncdeps --force --noconfirm --noprogressbar
            makepkg --printsrcinfo > .SRCINFO
          '

      - name: Install the AUR deploy key
        if: env.HAS_AUR_KEY == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur

      - name: Push to the AUR
        if: env.HAS_AUR_KEY == 'true'
        working-directory: packaging/aur
        env:
          AUR_PKG: ${{ matrix.name }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # Impose the key + host-key handling on git's ssh directly; the runner's
          # HOME juggling means a ~/.ssh/config isn't reliably read. A dedicated deploy
          # key to a known host in ephemeral CI: skip host-key verification outright.
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          git config --global user.name  'Stéphane Jourdois'
          git config --global user.email 'stephane@jourdois.fr'
          git config --global --add safe.directory '*'
          # A never-published name clones as an empty repo; the first push creates it.
          git clone "ssh://aur@aur.archlinux.org/$AUR_PKG.git" aur-repo
          cp PKGBUILD .SRCINFO aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No change for $AUR_PKG $TAG."
          else
            git commit -m "Update to $TAG"
            git push
          fi

      - name: Note a skipped push
        if: env.HAS_AUR_KEY != 'true'
        env:
          AUR_PKG: ${{ matrix.name }}
        run: echo "AUR_SSH_KEY not set — built and validated $AUR_PKG, skipped the push."
