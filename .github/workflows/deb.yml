name: Debian package

on:
  # Chained to `Release`: the .debs attach to the GitHub release it creates.
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the .debs for and attach them to
        required: true

# No workflow-wide write: `build` checks out the tag and then runs its code —
# build scripts, dependency builds, cargo-deb — so it gets `contents: read`, and only
# `upload`, which touches no checkout, may write to the release. Declared per job below.

# `workflow_run` runs on the default branch; the jobs need the upstream run's tag.
env:
  TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}

jobs:
  # Build one .deb per distro, each inside that distro's own container so the binary
  # links against *its* FFmpeg / Leptonica (sonames differ across releases) and
  # cargo-deb's `$auto` (dpkg-shlibdeps) generates the matching `Depends:`. A .deb
  # built on the wrong distro fails at load time with e.g. `liblept.so.5` /
  # `libavutil.so.58` missing (issue #1).
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v')) }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'debian:bookworm-slim', codename: bookworm,    experimental: false }
          - { image: 'debian:trixie-slim',   codename: trixie,      experimental: false }
          - { image: 'debian:forky-slim',    codename: forky,       experimental: true  }
          - { image: 'debian:sid-slim',      codename: sid,         experimental: true  }
          # Ubuntu 22.04 (jammy): its PipeWire and FFmpeg 4.x are too old for the
          # recording stack. Build screenshots-only (no wlr-shot record, no
          # FFmpeg/PipeWire link); the description says so.
          - { image: 'ubuntu:22.04',         codename: jammy,       experimental: false, debargs: '--no-default-features --variant no-recording' }
          - { image: 'ubuntu:24.04',         codename: noble,       experimental: false }
          - { image: 'ubuntu:26.04',         codename: ubuntu2604,  experimental: true  }
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Refuse a tag that is not one
        run: |
          set -eu
          # TAG comes from a `workflow_run` head_branch, and is about to name the ref
          # this job checks out and then executes. A branch name may hold anything a
          # ref allows; a release tag may not.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "refusing '$TAG': a release tag is vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
      - name: Install build prerequisites
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config clang \
            libwayland-dev libxkbcommon-dev libfontconfig-dev libgbm-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev libva-dev \
            libpipewire-0.3-dev libtesseract-dev libleptonica-dev libdbus-1-dev
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Install Rust (rustup; the version comes from rust-toolchain.toml)
        run: |
          set -eux
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build the .deb (one bundle package with every binary)
        run: cargo deb -p wlr-utils ${{ matrix.debargs }}
      - name: Tag the artifact with its distro codename
        run: |
          set -eux
          mkdir -p dist
          for f in target/debian/*.deb; do
            base="$(basename "$f" .deb)"
            cp "$f" "dist/${base}.${{ matrix.codename }}.deb"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.codename }}
          path: dist/*.deb
          if-no-files-found: error

  # Collect every distro's .deb and attach them to the GitHub release. Runs on the
  # host (not a container) so the `gh` CLI is available.
  upload:
    needs: build
    if: ${{ always() && needs.build.result != 'cancelled' && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so `gh` can't infer the repo from git; name it
          # explicitly, otherwise every `gh release …` fails with "not a git repository".
          GH_REPO: ${{ github.repository }}
        run: |
          set -eux
          gh release upload "$TAG" dist/*.deb --clobber
