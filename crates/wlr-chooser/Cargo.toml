[package]
name = "wlr-chooser"
description = "Graphical window & screen picker for wlroots screencast portals (xdg-desktop-portal-wlr), with the wlr-switcher Alt-Tab/exposé and their wlr-overlayd daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["wayland", "wlroots", "screencast", "portal", "sway"]
categories = ["gui", "command-line-utilities"]

[lib]
name = "wlr_chooser"
path = "src/lib.rs"

[[bin]]
name = "wlr-chooser"
path = "src/bin/wlr-chooser.rs"

[[bin]]
name = "wlr-switcher"
path = "src/bin/wlr-switcher.rs"

[[bin]]
name = "wlr-overlayd"
path = "src/bin/wlr-overlayd.rs"

[dependencies]
# `compose` is on for `capture::WindowFilter`, so `--app-id` / `--title` compare windows
# here exactly as they do in wlr-shot. It only pulls `image`, already a direct dependency.
wlr-capture = { path = "../wlr-capture", version = "1.9.0", default-features = false, features = ["toolkit", "focus", "compose", "pointer", "keys"] }
# This crate owns its localised catalog (`i18n/`); wlr-i18n is the shared loader plumbing.
wlr-i18n = { path = "../wlr-i18n", version = "1.9.0", default-features = false }
# For `#[derive(RustEmbed)]` over `i18n/` (the `i18n` feature).
rust-embed = { workspace = true, optional = true }
anyhow.workspace = true
egui.workspace = true
smithay-client-toolkit.workspace = true
wayland-client.workspace = true
# keyboard-shortcuts-inhibit (unstable): suspend compositor shortcuts while the
# overlay is focused so a held Alt-Tab chord reaches us instead of re-firing the
# binding. The workspace dep already pulls staging+client; add the unstable set.
wayland-protocols = { workspace = true, features = ["unstable"] }
rustix.workspace = true
image.workspace = true
clap.workspace = true
# xkbcommon to read the compositor's keymap: a tile hint is a physical key, labelled
# with whatever the active layout prints on it. Already linked transitively via
# smithay-client-toolkit (no new system dep).
xkbcommon.workspace = true
# `--json`: one object per pick, escaped properly. Already in the tree via
# wlr-capture's compositor IPC backends.
serde_json.workspace = true

[features]
default = ["gpu", "i18n"]
gpu = ["wlr-capture/gpu"]
# Localised UI via Fluent. On by default; `--no-default-features` builds English-only
# with no Fluent dependency.
i18n = ["wlr-i18n/i18n", "dep:rust-embed"]

[package.metadata.deb]
maintainer = "Stéphane Jourdois <stephane@jourdois.fr>"
section = "utils"
priority = "optional"
license-file = ["../../LICENSE-MIT", "0"]
# libEGL and libfontconfig are dlopen'd at runtime (not linked), so add them on top of the
# auto-detected deps.
depends = "$auto, libegl1, libfontconfig1"
recommends = "fonts-noto-cjk"
extended-description = """\
A graphical window & screen picker for wlroots screencast portals \
(xdg-desktop-portal-wlr): a rofi-like overlay with live thumbnails to pick a \
window or monitor to share. Ships wlr-switcher, the Alt-Tab/exposé window \
switcher built on the same overlay, and wlr-overlayd, the optional daemon that \
holds their GPU context so the overlay appears at once."""
assets = [
    ["../../target/release/wlr-chooser", "usr/bin/", "755"],
    ["../../target/release/wlr-switcher", "usr/bin/", "755"],
    ["../../target/release/wlr-overlayd", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/wlr-chooser/README.md", "644"],
    ["../../docs/themes/*.toml", "usr/share/doc/wlr-chooser/themes/", "644"],
]

[package.metadata.dist]
# Bundled into the `wlr-utils` crate for prebuilt archives/installers; not shipped as a
# standalone prebuilt app (still published to crates.io for à-la-carte `cargo install`).
dist = false

# Generates the English fallback table for the no-Fluent build.
[build-dependencies]
wlr-i18n = { path = "../wlr-i18n", version = "1.9.0", default-features = false }
